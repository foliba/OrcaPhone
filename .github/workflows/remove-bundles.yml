name: Remove App Bundles from releases

# One-off: deletes every .aab file attached to a GitHub release. App Bundles are never published (only the
# APK); this cleans up the releases from before that rule. Runs when this file is pushed; delete it afterwards.
on:
  push:
    paths:
      - .github/workflows/remove-bundles.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete .aab release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName'); do
            for asset in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep '\.aab$' || true); do
              echo "Deleting $asset from $tag"
              gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          done
          echo "Remaining .aab files:"
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName'); do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep '\.aab$' | sed "s|^|$tag: |" || true
          done
