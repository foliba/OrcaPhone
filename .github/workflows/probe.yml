name: Printables probe (temporary)
on:
  push:
    branches: ["feature/printables"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) OrcaPhone/0.2'
          gql() { echo "=== $1"; curl -sS -m 30 -A "$UA" -H 'Content-Type: application/json' -H 'Origin: https://www.printables.com' -H 'Referer: https://www.printables.com/' -w '\nHTTP %{http_code}\n' https://api.printables.com/graphql/ -d "$2" | head -c 3000; echo; }
          for f in gcodes slas downloadPacks threeMfs otherFiles image filesType zipPath premium price club isPrivate; do
            gql "field-$f" "{\"query\":\"{ print(id: \\\"3161\\\") { $f } }\"}"
          done
          gql stl-fields '{"query":"{ print(id: \"3161\") { stls { id name fileSize filePreviewPath folder note fileType } } }"}'
          for id in 900123 1000123 1100123 1200123 1300123 1400123; do
            gql "m$id" "{\"query\":\"{ print(id: \\\"$id\\\") { id name stls { id name fileSize } otherFiles { id name fileSize } } }\"}"
          done
          gql dl '{"query":"mutation GetDownloadLink($id: ID!, $modelId: ID!, $fileType: DownloadFileTypeEnum!, $source: DownloadSourceEnum!) { getDownloadLink(id: $id, printId: $modelId, fileType: $fileType, source: $source) { ok errors { field messages } output { link count ttl } } }","variables":{"id":"49068","modelId":"3161","fileType":"stl","source":"model_detail"}}' | tee dl.txt
          LINK=$(grep -o '"link":"[^"]*"' dl.txt | head -1 | sed 's/"link":"//;s/"$//')
          echo "LINK=$LINK"
          [ -n "$LINK" ] && curl -sS -m 60 -A "$UA" -o f.bin -w 'HTTP %{http_code} size=%{size_download} type=%{content_type}\n' "$LINK" && head -c 80 f.bin | xxd | head -3
          echo "=== preview"; curl -sS -m 30 -A "$UA" -o p.png -w 'HTTP %{http_code} size=%{size_download} type=%{content_type}\n' "https://media.printables.com/media/prints/3161/stls/123914_1f1d8ca1-252a-4770-846f-52f1208d193d/3dbenchy_preview.png"
          echo "=== short"; curl -sSI -m 30 -A "$UA" https://prnt.pr/3161 | head -5
