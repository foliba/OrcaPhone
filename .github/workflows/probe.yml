name: Printables probe (temporary)
on:
  push:
    branches: ["feature/printables"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) OrcaPhone/0.2'
          gql() { echo "=== $1"; curl -sS -m 30 -A "$UA" -H 'Content-Type: application/json' -H 'Origin: https://www.printables.com' -H 'Referer: https://www.printables.com/' -w '\nHTTP %{http_code}\n' https://api.printables.com/graphql/ -d "$2" | head -c 6000; echo; }
          gql intro-print '{"query":"{ __type(name:\"PrintType\") { fields { name type { name kind ofType { name kind ofType { name kind ofType { name } } } } } } }"}'
          gql intro-query '{"query":"{ __schema { queryType { fields { name args { name } } } mutationType { fields { name args { name type { name kind ofType { name } } } } } } }"}'
          gql enum-dl '{"query":"{ a: __type(name:\"DownloadFileTypeEnum\") { enumValues { name } } b: __type(name:\"DownloadSourceEnum\") { enumValues { name } } }"}'
          gql intro-stl '{"query":"{ __type(name:\"STLType\") { fields { name } } }"}'
          gql intro-other '{"query":"{ __type(name:\"OtherFileType\") { fields { name } } }"}'
          gql intro-user '{"query":"{ a: __type(name:\"UserType\") { fields { name } } b: __type(name:\"LicenseType\") { fields { name } } }"}'
          gql model '{"query":"query P($id: ID!) { print(id: $id) { id name slug user { publicUsername handle } license { name abbreviation } stls { id name fileSize filePreviewPath } otherFiles { id name fileSize } } }","variables":{"id":"3161"}}'
          gql dl '{"operationName":"GetDownloadLink","query":"mutation GetDownloadLink($id: ID!, $modelId: ID!, $fileType: DownloadFileTypeEnum!, $source: DownloadSourceEnum!) { getDownloadLink(id: $id, printId: $modelId, fileType: $fileType, source: $source) { ok errors { field messages } output { link count ttl } } }","variables":{"id":"0","modelId":"3161","fileType":"stl","source":"model_detail"}}'
          echo "=== page"; curl -sS -m 30 -A "$UA" -o page.html -w 'HTTP %{http_code} %{url_effective}\n' -L https://www.printables.com/model/3161-3d-benchy; head -c 600 page.html; echo
          echo "=== media"; curl -sSI -m 30 -A "$UA" https://media.printables.com/ | head -5
