name: Release

# Push a tag like v0.1.0 (or run this workflow manually with a version) to build the APK and
# publish a GitHub release. A manual run creates the tag on the commit it runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          # the open-source GitHub Actions cache, not the default commercial caching service
          cache-provider: basic

      - name: Tests
        run: ./gradlew :slicer-core:test

      # Upload key for Google Play (and the GitHub APK): repository secrets PHORCA_KEYSTORE_BASE64
      # (the .jks file, base64), PHORCA_KEYSTORE_PASSWORD, PHORCA_KEY_ALIAS, PHORCA_KEY_PASSWORD.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHORCA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PHORCA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key configured: the release is signed with the debug key and can't go to Google Play."
          fi

      - name: Build release APK and App Bundle
        env:
          PHORCA_KEYSTORE_PASSWORD: ${{ secrets.PHORCA_KEYSTORE_PASSWORD }}
          PHORCA_KEY_ALIAS: ${{ secrets.PHORCA_KEY_ALIAS }}
          PHORCA_KEY_PASSWORD: ${{ secrets.PHORCA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Prepare release files
        run: |
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Phorca-${VERSION}.apk"
          # Release notes: the CHANGELOG section of this version
          awk -v v="$VERSION" '$0 ~ "^## "v {p=1; next} /^## / {p=0} p' CHANGELOG.md > dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Phorca v${{ env.VERSION }}
          body_path: dist/notes.md
          # the APK only: the App Bundle (Google Play's format) is never published
          files: dist/*.apk
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
