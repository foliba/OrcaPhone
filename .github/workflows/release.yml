name: Release

# Push a tag like v0.1.0 (or run this workflow manually with a version) to build the APK and
# publish a GitHub release. A manual run creates the tag on the commit it runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :slicer-core:test

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare release files
        run: |
          if [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/OrcaPhone-${VERSION}.apk"
          # Release notes: the CHANGELOG section of this version
          awk -v v="$VERSION" '$0 ~ "^## "v {p=1; next} /^## / {p=0} p' CHANGELOG.md > dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: OrcaPhone v${{ env.VERSION }}
          body_path: dist/notes.md
          files: dist/*.apk
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
