name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          # the open-source GitHub Actions cache, not the default commercial caching service
          cache-provider: basic
          # also on branches: the emulator jobs below start from this cache instead of each downloading everything
          cache-read-only: false

      - name: Slicer core unit tests
        run: ./gradlew :slicer-core:test

      - name: Printables live API check
        # Talks to printables.com, so it must not block the build when the site is down or changes.
        continue-on-error: true
        env:
          PRINTABLES_LIVE: "1"
        run: |
          set -o pipefail
          ./gradlew :slicer-core:test --tests '*PrintablesTest.liveBenchy' --rerun -i 2>&1 | { grep -E "Live model|liveBenchy|Exception|Error" || true; }

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee build.log || { echo "==== compiler errors ===="; grep -E "^e: " build.log; exit 1; }

      - name: Build release APK
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Phorca-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  device-test:
    # after the build job, so the 8 emulators reuse its downloads (in parallel they got throttled by the servers)
    needs: build
    # Android 11 up to the newest version, each on a phone and a tablet: newer versions lay out system
    # bars and dialogs differently (Android 15 caught the Import bar being pushed off-screen).
    strategy:
      fail-fast: false
      matrix:
        # Android 17's SDK packages are named 37.0
        api: ['30', '35', '36', '37.0']
        # tablet: wide screen, starts in landscape (caught the view buttons under the object panel)
        device: [phone, tablet]
    # Runs the slicer on a real Android runtime (catches Android-only issues such as ICU regex differences).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          # the open-source GitHub Actions cache, not the default commercial caching service
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          # Android 11 runs the plain image, the newer versions the Google APIs image; Android 17's is
          # published only with 16 KB memory pages (its default)
          target: ${{ matrix.api == '30' && 'default' || (matrix.api == '37.0' && 'google_apis_ps16k' || 'google_apis') }}
          profile: ${{ matrix.device == 'tablet' && 'pixel_tablet' || '' }}
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # AGP 9 no longer prints failing tests to the log: show them from the result files
          script: ./gradlew :app:connectedDebugAndroidTest || { for f in $(grep -rl '<failure' app/build/outputs/androidTest-results 2>/dev/null); do echo "==== $f"; grep -B1 -A12 '<failure' "$f" | cut -c1-400; done; exit 1; }
