name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Slicer core unit tests
        run: ./gradlew :slicer-core:test

      - name: Printables live API check
        # Talks to printables.com, so it must not block the build when the site is down or changes.
        continue-on-error: true
        env:
          PRINTABLES_LIVE: "1"
        run: |
          set -o pipefail
          ./gradlew :slicer-core:test --tests '*PrintablesTest.liveBenchy' --rerun -i 2>&1 | { grep -E "Live model|liveBenchy|Exception|Error" || true; }

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee build.log || { echo "==== compiler errors ===="; grep -E "^e: " build.log; exit 1; }

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: OrcaPhone-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  device-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 35, target: google_apis }
          - { api: 36, target: google_apis }
          - { api: 37, target: google_apis }
    # Runs the slicer on a real Android runtime (catches Android-only issues such as ICU regex differences).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
