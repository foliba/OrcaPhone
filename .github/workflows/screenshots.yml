name: Store screenshots

# Takes the Google Play screenshots (StoreScreenshotsTest) on a phone and a tablet emulator and offers them
# as the artifact "store-screenshots". Run it by hand under Actions when the UI has changed.
# Phones use the Pixel 2 profile: Play wants screenshots at most twice as long as wide.
on:
  workflow_dispatch:

jobs:
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: phone, profile: pixel_2 }
          - { device: tablet, profile: pixel_tablet }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.foliba.phorca.StoreScreenshotsTest -Pandroid.testInstrumentationRunnerArguments.screenshots=true
            mkdir -p screenshots/${{ matrix.device }} && adb pull /sdcard/Download/phorca-screenshots/. screenshots/${{ matrix.device }}/

      - uses: actions/upload-artifact@v7
        with:
          name: store-screenshots-${{ matrix.device }}
          path: screenshots/
          if-no-files-found: error
